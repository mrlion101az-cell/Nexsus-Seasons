name: NexusSeasons
version: ${project.version}
main: com.nexusuniverse.seasons.NexusSeasonsPlugin
api-version: '1.21'
author: Nexus Universe
description: Year/season/day tracking, seasonal plant growth and mob spawn rates, winter snow accumulation, a "crazy weather" layer (dry thunderstorms, particle fog, blizzards, physics-driven tornadoes, real continuously-scrolling rows of raised water rolling across the open surface of any body of water 40x40 blocks or larger -- lakes and ponds work exactly like the ocean -- plus crashing shore-break waves up to 10 blocks tall that wash onto land and back out, pushing players and lifting boats, plus tsunamis and hurricanes on top of that staying single massive waves rather than a field of smaller ones, a scoreboard wind/weather HUD, and continuous wind including sharper, unpredictable direction-shifting gusts that can push players and dislodge fragile blocks -- no resource pack), and a public API for other Nexus plugins to read the current season.

commands:
  nexusseasons:
    description: View and manage the season clock and extreme weather.
    aliases: [seasons, ns3]
    usage: /nexusseasons <status|setyear <n>|setseason <name>|setday <n>|advance|reload|cyclelock <on|off|status>|drythunder <start [seconds]|stop|status>|fog <start [seconds]|stop|status>|blizzard <start [seconds]|stop|status>|tornado <spawn|stop|status>|tsunami <spawn|stop|status>|hurricane <start [minutes]|stop|status>|wavereset [radius]>

permissions:
  nexusseasons.admin:
    description: Manage NexusSeasons, including forcing/stopping extreme weather events.
    default: op
