# NexusSeasons configuration

season:
  # how many in-game days each season lasts. One in-game day = one full
  # Minecraft day/night cycle (24000 ticks), same as vanilla.
  days-per-season: 30
  # the year and season this world starts on, the FIRST time this plugin
  # ever runs (after that, the live value lives in season-state.yml and
  # this is ignored -- edit that file, or use /nexusseasons setyear, to
  # change it later)
  starting-year: 356
  starting-season: SPRING

# Growth-tick multiplier per season. 1.0 = unchanged. Below 1.0 means a
# natural crop-growth tick has a chance to be vetoed (net effect: slower
# growth). Above 1.0 means a successful growth tick has a chance of an
# extra growth stage on top (net effect: faster growth). Applies to any
# block that fires BlockGrowEvent (crops, saplings, etc).
plant-growth:
  spring: 1.3
  summer: 1.2
  fall: 1.0
  winter: 0.4

# Natural mob spawn weight per season, per entity type (lowercase vanilla
# name, e.g. "zombie", "skeleton", "spider"). 1.0 = unchanged. Below 1.0
# thins that spawn out; above 1.0 has no additional effect on its own
# (see WorldVisualManager/SeasonalMobSpawner docs) -- any mob/season
# combination not listed here defaults to 1.0.
mob-spawns:
  winter:
    zombie: 0.7
  fall:
    spider: 1.0

# Override vanilla's day/night cycle with a fixed, even 12-hour-day /
# 12-hour-night split stretched across real time, instead of vanilla's
# ~20-real-minute full cycle. Only affects normal (overworld-type)
# worlds -- the Nether and the End are untouched.
# NOTE: this is read once at startup. Flipping "enabled" and running
# /nexusseasons reload will NOT toggle it live -- restart the server.
#
# Defaults below give a 12-real-hour full day/night cycle (6h day + 6h
# night), the same even day/night split a real 24-hour day has, just
# compressed 2x into half a real day instead of a whole one. Change
# day-length-minutes/night-length-minutes independently if you want a
# different split or total length -- they don't have to match each other.
day-night:
  enabled: true
  day-length-minutes: 360
  night-length-minutes: 360

# Same idea as day-night above, applied to weather: instead of leaving vanilla's own random
# weather engine in charge and just protecting it from being disabled, NexusSeasons becomes the
# sole authority over storm/thunder on its own real-time schedule. Picks a random duration for
# the current state (clear, or rain with a chance of thunder), and re-asserts that state on every
# managed world every tick -- this is what actually defeats a command (or command block) trying
# to force a specific weather state, not just a gamerule protecting against it.
# NOTE: also read once at startup, same as day-night.enabled above -- toggling this needs a restart.
weather:
  enabled: true
  clear-min-minutes: 20
  clear-max-minutes: 45
  rain-min-minutes: 10
  rain-max-minutes: 25
  # chance a rain period also includes thunder, rolled fresh each time weather switches to rain
  thunder-chance: 0.35

# Continuously re-asserts the doDaylightCycle/doWeatherCycle gamerules this
# plugin needs (checked every tick, so a wrong value is corrected within
# about 50ms), and separately cancels the specific commands that would
# disable them -- "/gamerule doDaylightCycle <value>"/"/gamerule
# doWeatherCycle <value>" (a bare read with no value is still allowed),
# "/time set"/"/time add", and "/weather clear|rain|thunder" -- before
# they run, for players and console.
#
# NOTE: command blocks can't be intercepted before they run this way --
# Bukkit/Paper has never exposed an event for that, for any plugin, not
# just this one. A command block trying one of the above still gets
# corrected within a tick by DayNightCycleManager/WeatherCycleManager
# (when their respective *.enabled is on) reasserting their own state
# every tick regardless of what changed it, and by the every-tick
# gamerule re-assertion below for everything else -- just not prevented
# outright the way a player or console command is.
#
# The only sanctioned way to turn any of this off is /nexusseasons
# cyclelock off, which flips this value and saves it immediately (a live
# toggle, not a config-edit-and-restart setting like day-night.enabled
# above).
cycle-lock:
  enabled: true

visuals:
  # real snow accumulation/melt on cold-biome surfaces during Winter --
  # the one genuinely visible "the map changes" effect achievable without
  # a resource pack.
  snow-accumulation: true
  # how many surface blocks to check per sweep, budgeted to avoid a lag spike
  snow-blocks-per-tick: 64
  # how often (seconds) the sweep runs
  sweep-interval-seconds: 5

ambiance:
  # a big, unmissable banner announcement when a season actually changes
  # (includes the "a new year begins" line automatically when applicable)
  transition-enabled: true
  # quieter, italicized "environmental dialogue" lines dropped periodically
  # DURING a season, at a randomized delay between the two values below --
  # a new random delay is picked after every line, so it never falls into
  # a predictable rhythm the way a fixed timer would
  enabled: true
  min-interval-minutes: 8
  max-interval-minutes: 20

music:
  # a real, looping seasonal soundtrack built entirely from vanilla music
  # tracks (Sound.MUSIC_* -- no resource pack, no custom audio files).
  # Played under SoundCategory.MUSIC, so it respects each player's own
  # in-game Music volume slider, same as vanilla background music.
  enabled: true
  # how long (seconds) a track plays before switching to another random
  # track from the current season's pool. Vanilla tracks vary in real
  # length; this doesn't try to match each one exactly -- it's a fixed
  # rotation interval, same approach as a radio station's block length.
  track-length-seconds: 210

# ============================================================================
# "Crazy weather" -- particle/physics effects built entirely from plugin code,
# no resource pack. Every section below is independently enable-able. Each
# event (dry-thunder/fog/blizzard/tornado) can also occur naturally: every
# check-interval-minutes, it rolls natural-chance (0.0-1.0) to start on its
# own for a random duration between the min/max seconds -- set natural-chance
# to 0 if you only ever want to trigger these by hand with /nexusseasons.
# ============================================================================

# Continuous ambient wind -- always running (not a start/stop event like the
# others below). Direction and strength slowly drift, with a bigger re-roll
# every change-interval-minutes.
wind:
  enabled: true
  # 0.0-1.0 scale
  min-strength: 0.05
  max-strength: 0.5
  change-interval-minutes: 10
  # gently push players standing with open sky above them in the wind direction
  push-players: true
  # below this strength, players aren't pushed at all -- a light breeze shouldn't shove anyone
  player-push-min-strength: 0.3
  player-push-multiplier: 0.15
  # once wind strength crosses this, it's strong enough to start tearing loose blocks free
  severe-threshold: 0.7
  # per-tick chance of blowing away one eligible block once severe-threshold is crossed
  dislodge-chance-per-tick: 0.02
  # how far around a random online player to search for something to dislodge
  dislodge-search-radius: 12
  # block types that count as "sits by itself, isn't heavily supported" -- leave empty to use the
  # built-in default list (wool, fences, leaves, saplings, torches, ladders, scaffolding)
  fragile-materials: []

  # Short, sharper bursts layered on top of the steady drift above -- a gust can swing well off
  # the current steady direction and briefly push harder, which is what actually gives the
  # "pushed and pulled all over the place" feel; the slow drift alone just reads as wind slowly
  # rotating over many minutes.
  gust:
    enabled: true
    # how often (seconds) to roll whether a new gust starts
    check-interval-seconds: 15
    # chance on each roll that a gust actually starts
    chance: 0.3
    duration-min-seconds: 3
    duration-max-seconds: 8
    # how far off the steady wind direction a gust can swing, in degrees either side --
    # 180 allows a near-total reversal, small values keep gusts closer to the prevailing direction
    direction-swing-degrees: 120
    # how much stronger than the current steady wind a gust gets (capped at 1.0 strength either way)
    strength-multiplier: 1.8

# Real lightning and thunder with NO rain -- the sky stays clear, this never touches world storm
# state at all. Genuinely achieved through the real API (World#strikeLightningEffect, the
# visual/audio-only variant -- no fire, no block damage, no entity damage).
dry-thunder:
  enabled: true
  natural-chance: 0.15
  check-interval-minutes: 20
  duration-min-seconds: 60
  duration-max-seconds: 180
  # how often a strike happens while active
  strike-min-interval-seconds: 5
  strike-max-interval-seconds: 20
  # how far from a random online player a strike can land
  strike-radius: 40
  play-sound: true

# HONEST LIMIT: this is a dense particle haze around each player, not real render-distance fog --
# there's no plugin-only way to actually shrink how far a client renders without a resource pack
# or packet-level tricks (this server does have ProtocolLib installed, which COULD do real fog
# packets, but that's real extra scope beyond this config-driven version). See FogManager's doc
# comment for the full explanation.
fog:
  enabled: true
  natural-chance: 0.15
  check-interval-minutes: 25
  duration-min-seconds: 60
  duration-max-seconds: 240
  # how far out from each player the haze particles spawn
  radius: 6.0
  # particles spawned per player per tick-pass -- higher is thicker fog but more particle load
  density: 25
  color-r: 220
  color-g: 220
  color-b: 225

# Blowing-snow whiteout around each player -- works anywhere, not gated to snowy biomes, since
# it's a localized effect rather than a change to the world/biome state.
blizzard:
  enabled: true
  natural-chance: 0.1
  check-interval-minutes: 25
  duration-min-seconds: 90
  duration-max-seconds: 300
  radius: 8.0
  density: 20
  # forces wind.severe-threshold-level wind for the blizzard's duration -- a blizzard should feel
  # windier than an ordinary day
  force-wind: true
  apply-slowness: true
  # potion amplifier, 0 = Slowness I
  slowness-amplifier: 0

# A spinning particle-vortex funnel with REAL physics -- pulls, lifts, and spins players caught
# inside it, and can rip up fragile blocks (same fragile-materials list as wind.*) into flying
# debris. Only one tornado runs at a time. "Leaf debris" is tinted dust particles, not a literal
# leaf particle -- see TornadoManager's doc comment.
tornado:
  enabled: true
  natural-chance: 0.05
  check-interval-minutes: 30
  duration-min-seconds: 30
  duration-max-seconds: 90
  # horizontal radius of the funnel
  radius: 6.0
  # how tall the funnel is, in blocks
  height: 30
  # how fast the whole tornado drifts across the terrain, in blocks/tick
  move-speed: 0.15
  # how fast the funnel visually spins
  spin-speed: 0.35
  # physics strength toward the center
  pull-strength: 0.35
  # physics strength upward, near the center
  lift-strength: 0.3
  # physics strength spinning a caught player around the vortex
  swirl-strength: 0.4
  # hard cap on how much velocity gets added to a player in one tick, regardless of the above
  max-velocity-per-tick: 1.2
  destroy-fragile-blocks: true
  # budgeted fragile-block removals per tick while a tornado is active -- kept low on purpose,
  # same throttling idea as NexusSeasons' own snow-accumulation sweep
  blocks-per-tick: 2

# Continuous ambient ocean swell -- always running near open ocean (not a start/stop event).
# Amplitude and frequency both scale with wind.* strength, so calmer wind gives small gentle
# waves and stronger wind gives bigger, rougher ones -- "different types of waves" comes from
# that connection rather than separate named wave presets.
waves:
  enabled: true
  base-amplitude: 0.15
  wind-amplitude-multiplier: 0.6
  base-frequency: 0.02
  wind-frequency-multiplier: 0.03
  push-swimmers: true
  # below this wind strength, swimmers aren't pushed by the current at all
  push-min-wind-strength: 0.3
  push-multiplier: 0.1

  # Shared water-body detection, used by both the ambient waves above and shore-break below. Works
  # on ANY body of water this size or larger -- lakes and ponds count exactly like the ocean does,
  # at whatever height that water's own surface actually sits (not hardcoded to sea level).
  min-body-size: 40
  # hard cap on how many blocks the flood-fill size check will visit before giving up on a body
  # that never reaches min-body-size -- bounds worst-case cost for oddly-shaped small ponds
  body-detection-max-blocks: 4000
  # small radius used to cheaply rule out "not near any water at all" before ever attempting the
  # much more expensive flood-fill size check
  water-search-radius: 5
  # how long (seconds) a player's "am I in a big enough body of water" result is cached before
  # being rechecked -- the flood-fill is too expensive to run on every tick for every player
  eligibility-cache-seconds: 8

  # REAL, continuous, recurring waves that crash onto the shore and wash back out -- built on the
  # exact same "advance inland then recede, remembering and restoring every block it floods" real
  # water engine tsunami/hurricane storm-surge use, just run in small frequent bursts instead of
  # one huge one. Pushes players AND boats caught in them -- a boat gets extra upward lift so it
  # visibly rides up over the wave rather than just getting shoved through it. Height scales with
  # wind.* strength between min-height and max-height, so calm days get small lapping waves and
  # rough/stormy wind gets the full-height waves crashing inland.
  shore-break:
    enabled: true
    # how often (seconds) to check whether a new wave should start somewhere
    check-interval-seconds: 6
    # how many shore-break waves can be actively crashing/receding at once, across the whole server
    max-concurrent: 3
    coast-search-radius: 60
    min-height: 1.0
    max-height: 10.0
    # how far inland one wave reaches at most
    max-inland-distance: 14.0
    # blocks/tick the front advances -- deliberately slow (much slower than tsunami/hurricane use)
    # so a wave actually reads as visibly moving in over a couple of seconds, rather than water
    # just appearing almost instantly
    advance-speed: 0.35
    # width (in blocks) of one wave's leading edge
    front-width: 24.0
    knockback-strength: 0.9
    # hard cap on how many blocks one shore-break wave will remember/flood
    max-affected-blocks: 800
    # how long (seconds) the drain-back-out phase visibly takes, regardless of how many blocks
    # actually got flooded -- a fixed, predictable pace rather than draining almost instantly for
    # a small flood and only looking deliberate on a large one
    recede-duration-seconds: 4
    # how long (seconds), after a wave fully finishes, that same spot stays off-limits to a new
    # one -- the real "goes back to normal and stays calm for a while" gap between waves
    cooldown-seconds: 20
    # how far apart (blocks) two waves -- or a new wave and a spot still on cooldown -- have to be
    spacing-radius: 80

  # REAL, continuously scrolling rows of raised water -- a genuine wave TRAIN moving across the
  # open surface of any qualifying body of water, separate from shore-break above (which is one
  # wave flooding onto land near the shore, then draining out). A periodic pattern -- a ridge of
  # raised water blocks, then a gap of flat water, then the next ridge -- that scrolls
  # continuously in the current wind direction. Runs per-player around anyone standing at/in a
  # qualifying body. Deliberately does NOT run anywhere a tsunami or hurricane surge is currently
  # active, so those stay one massive single wave rather than a field of smaller rolling swell.
  wave-train:
    enabled: true
    # how often (real ticks) the pattern recomputes -- travel speed (below) is independent of this
    tick-interval: 2
    # how many blocks wide (along the direction of travel) one ridge is
    ridge-width: 3
    # how many blocks of flat water separate one ridge from the next
    gap-width: 5
    min-height: 1
    max-height: 2
    # blocks/real-tick the whole pattern travels -- deliberately slow so it reads as rolling
    # swell, not a flicker
    speed: 0.15
    # how wide (blocks, perpendicular to travel) the visible field is around each player
    span: 24
    # how far (blocks, ahead of and behind the player along the travel direction) it extends
    reach: 20
    # hard cap on how many columns get touched per player per pass
    blocks-per-tick: 150

# A single dramatic coastal surge, built on the same "advance inland then recede, remembering and
# restoring every block it temporarily floods" engine hurricane storm-surge uses. Real warning
# (message + sound) before it actually hits.
tsunami:
  enabled: true
  natural-chance: 0.02
  check-interval-minutes: 45
  # how far out to search for a coastline near the trigger point
  coast-search-radius: 60
  warning-seconds: 15
  max-inland-distance: 40.0
  # blocks/tick the front advances
  advance-speed: 1.2
  # width (in blocks) of the wave's leading edge
  front-width: 40.0
  # how many blocks above sea level it floods up to
  wave-height: 6.0
  knockback-strength: 1.4
  # hard cap on how many blocks one tsunami will remember/flood -- protects performance and memory on a very large surge
  max-affected-blocks: 6000

# An orchestrated event, not a new effect of its own -- ramps wind.* up to a real severe level,
# forces REAL vanilla rain/thunder (genuine weather, not a particle simulation) once intensity
# crosses rain-threshold/thunder-threshold, optionally dips into a calm "eye" partway through, then
# weakens back to nothing. Periodically pulses a gentler, sustained version of the tsunami surge
# above near any coastline it can find.
hurricane:
  enabled: true
  natural-chance: 0.03
  check-interval-minutes: 60
  duration-min-minutes: 15
  duration-max-minutes: 40
  # fraction of the storm's total duration spent ramping up at the start / down at the end
  ramp-fraction: 0.15
  eye-enabled: true
  # fraction of the storm's total duration the calm eye occupies, centered on the midpoint
  eye-width-fraction: 0.1
  # intensity (0.0-1.0) at the dead center of the eye -- not fully zero, real hurricane eyes are unnervingly calm but not silent
  eye-intensity: 0.1
  # wind.* strength floor once the storm is active at all, even at low intensity
  min-wind-strength: 0.6
  # intensity (0.0-1.0) needed before it actually starts raining
  rain-threshold: 0.25
  # intensity (0.0-1.0) needed before thunder becomes possible
  thunder-threshold: 0.6
  # re-rolled roughly every 5 seconds while thunder-eligible (not literally every tick, so it
  # holds for a real stretch instead of flickering) -- chance each roll that thunder is on
  # until the next roll
  thunder-chance-per-tick: 0.02
  storm-surge-enabled: true
  # how often (seconds) to attempt a new storm-surge pulse while the storm is intense enough
  surge-interval-seconds: 45
  surge-coast-search-radius: 60
  # storm surge is deliberately much gentler/shorter-ranged than a full tsunami
  surge-max-inland-distance: 15.0
  surge-advance-speed: 0.6
  surge-front-width: 30.0
  surge-wave-height: 3.0
  surge-knockback-strength: 0.6
  surge-max-affected-blocks: 1500

# A persistent scoreboard sidebar (upper-right corner) showing the current headline weather and a
# live wind meter. HONEST LIMIT: this is the actual closest real placement to a screen corner --
# there's no plugin API for true arbitrary HUD positioning without a resource pack or client mod.
# Turn this off if another plugin on the server also uses player scoreboards for its own sidebar
# (only one can show at a time -- a normal Bukkit limit, not specific to this).
weather-hud:
  enabled: true
  refresh-interval-seconds: 3
