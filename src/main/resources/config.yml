# NexusSeasons configuration

season:
  # how many in-game days each season lasts. One in-game day = one full
  # Minecraft day/night cycle (24000 ticks), same as vanilla.
  days-per-season: 30
  # the year and season this world starts on, the FIRST time this plugin
  # ever runs (after that, the live value lives in season-state.yml and
  # this is ignored -- edit that file, or use /nexusseasons setyear, to
  # change it later)
  starting-year: 356
  starting-season: SPRING

# Growth-tick multiplier per season. 1.0 = unchanged. Below 1.0 means a
# natural crop-growth tick has a chance to be vetoed (net effect: slower
# growth). Above 1.0 means a successful growth tick has a chance of an
# extra growth stage on top (net effect: faster growth). Applies to any
# block that fires BlockGrowEvent (crops, saplings, etc).
plant-growth:
  spring: 1.3
  summer: 1.2
  fall: 1.0
  winter: 0.4

# Natural mob spawn weight per season, per entity type (lowercase vanilla
# name, e.g. "zombie", "skeleton", "spider"). 1.0 = unchanged. Below 1.0
# thins that spawn out; above 1.0 has no additional effect on its own
# (see WorldVisualManager/SeasonalMobSpawner docs) -- any mob/season
# combination not listed here defaults to 1.0.
mob-spawns:
  winter:
    zombie: 0.7
  fall:
    spider: 1.0

# Override vanilla's day/night cycle with a fixed, even 12-hour-day /
# 12-hour-night split stretched across real time, instead of vanilla's
# ~20-real-minute full cycle. Only affects normal (overworld-type)
# worlds -- the Nether and the End are untouched.
# NOTE: this is read once at startup. Flipping "enabled" and running
# /nexusseasons reload will NOT toggle it live -- restart the server.
#
# Defaults below give a 12-real-hour full day/night cycle (6h day + 6h
# night), the same even day/night split a real 24-hour day has, just
# compressed 2x into half a real day instead of a whole one. Change
# day-length-minutes/night-length-minutes independently if you want a
# different split or total length -- they don't have to match each other.
day-night:
  enabled: true
  day-length-minutes: 360
  night-length-minutes: 360

# Same idea as day-night above, applied to weather: instead of leaving vanilla's own random
# weather engine in charge and just protecting it from being disabled, NexusSeasons becomes the
# sole authority over storm/thunder on its own real-time schedule. Picks a random duration for
# the current state (clear, or rain with a chance of thunder), and re-asserts that state on every
# managed world every tick -- this is what actually defeats a command (or command block) trying
# to force a specific weather state, not just a gamerule protecting against it.
# NOTE: also read once at startup, same as day-night.enabled above -- toggling this needs a restart.
weather:
  enabled: true
  clear-min-minutes: 20
  clear-max-minutes: 45
  rain-min-minutes: 10
  rain-max-minutes: 25
  # chance a rain period also includes thunder, rolled fresh each time weather switches to rain
  thunder-chance: 0.35

# Continuously re-asserts the doDaylightCycle/doWeatherCycle gamerules this
# plugin needs (checked every tick, so a wrong value is corrected within
# about 50ms), and separately cancels the specific commands that would
# disable them -- "/gamerule doDaylightCycle <value>"/"/gamerule
# doWeatherCycle <value>" (a bare read with no value is still allowed),
# "/time set"/"/time add", and "/weather clear|rain|thunder" -- before
# they run, for players and console.
#
# NOTE: command blocks can't be intercepted before they run this way --
# Bukkit/Paper has never exposed an event for that, for any plugin, not
# just this one. A command block trying one of the above still gets
# corrected within a tick by DayNightCycleManager/WeatherCycleManager
# (when their respective *.enabled is on) reasserting their own state
# every tick regardless of what changed it, and by the every-tick
# gamerule re-assertion below for everything else -- just not prevented
# outright the way a player or console command is.
#
# The only sanctioned way to turn any of this off is /nexusseasons
# cyclelock off, which flips this value and saves it immediately (a live
# toggle, not a config-edit-and-restart setting like day-night.enabled
# above).
cycle-lock:
  enabled: true

visuals:
  # real snow accumulation/melt on cold-biome surfaces during Winter --
  # the one genuinely visible "the map changes" effect achievable without
  # a resource pack.
  snow-accumulation: true
  # how many surface blocks to check per sweep, budgeted to avoid a lag spike
  snow-blocks-per-tick: 64
  # how often (seconds) the sweep runs
  sweep-interval-seconds: 5

ambiance:
  # a big, unmissable banner announcement when a season actually changes
  # (includes the "a new year begins" line automatically when applicable)
  transition-enabled: true
  # quieter, italicized "environmental dialogue" lines dropped periodically
  # DURING a season, at a randomized delay between the two values below --
  # a new random delay is picked after every line, so it never falls into
  # a predictable rhythm the way a fixed timer would
  enabled: true
  min-interval-minutes: 8
  max-interval-minutes: 20

music:
  # a real, looping seasonal soundtrack built entirely from vanilla music
  # tracks (Sound.MUSIC_* -- no resource pack, no custom audio files).
  # Played under SoundCategory.MUSIC, so it respects each player's own
  # in-game Music volume slider, same as vanilla background music.
  enabled: true
  # how long (seconds) a track plays before switching to another random
  # track from the current season's pool. Vanilla tracks vary in real
  # length; this doesn't try to match each one exactly -- it's a fixed
  # rotation interval, same approach as a radio station's block length.
  track-length-seconds: 210
